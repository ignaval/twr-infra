# Offline checks on every pull request (and on main): `tofu fmt -check` and `tofu validate`
# with no provider credentials and no state (nothing is planned or applied), plus
# scripts/check.sh (shellcheck, actionlint, the config and template checks, the script tests).
name: plan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: plan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tofu:
    name: tofu fmt + validate (no credentials)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Unverified: pick the current OpenTofu release, then take the sha256 of
      # tofu_<version>_linux_amd64.tar.gz from its SHA256SUMS, after checking that file's
      # signature as OpenTofu's install docs describe. Until then this job fails, on purpose.
      TOFU_VERSION: "1.10.7"
      TOFU_SHA256: REPLACE_ME
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install OpenTofu (release archive, checksum pinned)
        run: |
          if [ "$TOFU_SHA256" = REPLACE_ME ]; then
            echo "::error::pin TOFU_SHA256 in .github/workflows/plan.yml (see the comment there)"
            exit 1
          fi
          if [ "$(uname -m)" != x86_64 ]; then
            echo "::error::the pinned OpenTofu is for x86_64 Linux, this runner is $(uname -m)"
            exit 1
          fi
          archive="tofu_${TOFU_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/opentofu/opentofu/releases/download/v${TOFU_VERSION}/${archive}"
          echo "$TOFU_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/tofu"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/tofu" tofu
          echo "$RUNNER_TEMP/tofu" >> "$GITHUB_PATH"

      - name: tofu fmt -check
        working-directory: tofu
        run: tofu fmt -check -recursive -diff

      # -backend=false: no state, no credentials. init still downloads the provider plugin
      # from the registry, which validate needs.
      - name: tofu validate
        working-directory: tofu
        run: |
          tofu init -backend=false -input=false
          tofu validate

  lint:
    name: shellcheck + actionlint + file checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The same pin as the twr repository's CI (.github/workflows/ci.yml there).
      - name: Install actionlint (release binary, checksum pinned)
        run: |
          version=1.7.12
          sha256=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          if [ "$(uname -m)" != x86_64 ]; then
            echo "::error::the pinned actionlint is for x86_64 Linux, this runner is $(uname -m)"
            exit 1
          fi
          archive="actionlint_${version}_linux_amd64.tar.gz"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/${archive}"
          echo "$sha256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint

      # The Ubuntu runners have shellcheck and python3 with PyYAML (unverified for
      # ubuntu-24.04's current image; check.sh says so if one is missing).
      - name: scripts/check.sh
        env:
          CHECK_STRICT: "1"
        run: ACTIONLINT="$RUNNER_TEMP/actionlint" sh scripts/check.sh
